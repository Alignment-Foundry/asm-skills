name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run credential leak scan
        run: python3 scripts/audit-credentials.py
        working-directory: ${{ github.workspace }}

      - name: Run PII leak scan
        run: python3 scripts/audit-pii.py
        working-directory: ${{ github.workspace }}

      - name: Run genericness audit
        # CI runs against the committed .audit-generic-markers.example.json
        # (placeholder markers only) — the private .audit-generic-markers.json
        # never exists in CI by design. Real genericness enforcement is the
        # local pre-push gate: private markers + .publish-holdlist.md review.
        run: python3 scripts/audit-generic.py
        working-directory: ${{ github.workspace }}
